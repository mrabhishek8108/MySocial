<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0d"><meta name="description" content="MySocial — connect, share and discover.">
<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="styles.css">
<title>MySocial 🚀</title>
</head>
<body>
<div id="toast"></div>
<div id="authScreen" class="screen"><div class="auth-card">
<div class="brand">MySocial 🚀</div><p class="muted">Connect. Share. Discover.</p>
<div class="tabs"><button class="tab active" data-mode="login">Login</button><button class="tab" data-mode="signup">Create account</button></div>
<form id="authForm"><input id="name" class="signup-only hidden" placeholder="Name"><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (6+ characters)" minlength="6" required><button class="primary" id="authBtn">Login</button></form>
<p class="small muted">Production mode uses Supabase. Demo mode is only for local testing.</p>
</div></div>

<div id="app" class="hidden">
<header class="top"><div class="brand">MySocial 🚀</div><button data-page="profile" class="icon">◯</button></header>
<main>
<section id="home" class="page"><div id="stories" class="stories"></div>
<div class="composer"><div id="meAvatar" class="avatar">🙂</div><input id="quickText" placeholder="What's happening?"><button id="quickPost">Post</button></div><div id="feed"></div></section>
<section id="explore" class="page hidden"><h2>Explore</h2><input id="search" class="search" placeholder="Search people..."><div id="users"></div></section>
<section id="profile" class="page hidden"><div id="profileBox"></div></section>
<section id="alerts" class="page hidden"><h2>Notifications</h2><div id="alertsBox"></div></section>
<section id="messages" class="page hidden"><h2>Messages</h2><div id="messagesBox" class="card">Messaging UI is ready; realtime messaging needs the configured database.</div></section>
</main>
<nav class="nav"><button data-page="home">⌂<small>Home</small></button><button data-page="explore">⌕<small>Search</small></button><button id="newPost">＋</button><button data-page="alerts">♡<small>Alerts</small></button><button data-page="profile">◯<small>Profile</small></button></nav>
</div>

<dialog id="postDialog"><form method="dialog" class="dialog"><button class="x">×</button><h2>Create post</h2><textarea id="postBody" rows="6" placeholder="Share something..."></textarea><button id="publish" class="primary">Publish</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
